<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google 搜尋驗證碼 -->
    <meta name="google-site-verification" content="5t7AEdpChuhBJ5Md5lxJaiwJv_dLrNuTC2p88Nj6IPo" />
    <link rel="canonical" href="https://gmesyc.github.io/for-computer-lesson/msg.html" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪客留言板 - 電腦課專用</title>
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #2b2b2b; 
            color: #ffffff; 
            font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; 
        }
        .card-custom { 
            background-color: #3e3e3e; 
            border: 1px solid #555; 
            border-radius: 10px; 
        }
        .text-gold { 
            color: #f1c40f !important; 
        }
        .msg-card { 
            background-color: #1f1f1f; 
            border-left: 4px solid #f1c40f; 
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 800px;">
    
    <!-- 回首頁按鈕 -->
    <div class="mb-3">
        <a href="index.html" class="btn btn-outline-warning text-gold border-warning"><i class="fa-solid fa-house me-1"></i>回首頁</a>
    </div>

    <!-- 上半段：留言輸入表單 -->
    <div class="card card-custom p-4 mb-5 shadow">
        <h3 class="fw-bold text-gold mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>撰寫留言</h3>
        <form id="msg-form">
            <div class="mb-3">
                <label for="input-name" class="form-label text-light">您的姓名 / 稱呼：</label>
                <input type="text" id="input-name" class="form-control bg-dark text-light border-secondary" placeholder="例如：五年三班 小明" required>
            </div>
            <div class="mb-3">
                <label for="input-name" class="form-label text-light">留言內容：</label>
                <textarea id="input-msg" class="form-control bg-dark text-light border-secondary" rows="3" placeholder="請輸入想說的話..." required></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-warning fw-bold w-100">
                <i class="fa-solid fa-paper-plane me-1"></i>發送留言
            </button>
        </form>
    </div>

    <hr class="border-secondary my-4">

    <!-- 下半段：展示 Google Sheet 留言列表 -->
    <div class="card card-custom p-4 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-gold mb-0"><i class="fa-solid fa-comments me-2"></i>留言列表</h3>
            <button onclick="loadMessages()" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-rotate me-1"></i>重新整理</button>
        </div>
        
        <!-- 留言動態載入區域 -->
        <div id="message-list" class="mt-3">
            <p class="text-center text-muted"><i class="fa-solid fa-spinner fa-spin me-2"></i>正在從 Google Sheet 載入留言...</p>
        </div>
    </div>

</div>

<script>
    // 已套用您的 Google Apps Script Web App 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzi4GdnyIotPUChzczelEJFD7SeI8o4zJ5SwoJH-NJ9braLuV_AwF4TGfdR7ZcRZpYJ/exec";

    // 1. 載入並顯示 Google Sheet 中的留言 (A, B, C欄)
    async function loadMessages() {
        const listDiv = document.getElementById('message-list');
        try {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            
            if (data.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-muted">目前還沒有任何留言，快來成為第一個留言的人吧！</p>';
                return;
            }

            listDiv.innerHTML = data.map(msg => `
                <div class="card msg-card p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong class="text-gold fs-5"><i class="fa-solid fa-user-circle me-1"></i>${escapeHtml(msg.name)}</strong>
                        <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>${escapeHtml(msg.time)}</small>
                    </div>
                    <p class="mb-0 text-light fs-6" style="white-space: pre-line;">${escapeHtml(msg.message)}</p>
                </div>
            `).join('');

        } catch (err) {
            listDiv.innerHTML = '<p class="text-center text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i>讀取留言失敗，請確認網路連線。</p>';
        }
    }

    // 2. 發送留言到 Google Sheet
    document.getElementById('msg-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        const name = document.getElementById('input-name').value;
        const message = document.getElementById('input-msg').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>發送中...';

        const formData = new URLSearchParams();
        formData.append('name', name);
        formData.append('message', message);

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                body: formData
            });
            
            document.getElementById('input-msg').value = '';
            alert('留言成功發送！');
            loadMessages();
        } catch (err) {
            alert('發送失敗，請稍後再試！');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>發送留言';
        }
    });

    // 防止 XSS 攻擊的字串轉義函式
    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 頁面初次載入自動執行
    loadMessages();
</script>

</body>
</html>
