<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="google-site-verification" content="5t7AEdpChuhBJ5Md5lxJaiwJv_dLrNuTC2p88Nj6IPo" />
    <link rel="canonical" href="https://gmesyc.github.io/for-computer-lesson/msg.html" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪客留言板 - 電腦課專用</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔑 載入 Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body { 
            background-color: #2b2b2b; 
            color: #ffffff; 
            font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; 
        }
        .card-custom { 
            background-color: #3e3e3e; 
            border: 1px solid #555; 
            border-radius: 10px; 
        }
        .text-gold { 
            color: #f1c40f !important; 
        }
        .text-time {
            color: #cbd5e1 !important;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .msg-card { 
            background-color: #1f1f1f; 
            border-left: 4px solid #f1c40f; 
            margin-bottom: 15px; 
        }
        .msg-content {
            word-break: break-all;
            white-space: pre-line;
        }
        .form-control:focus {
            background-color: #212529 !important;
            color: #fff !important;
            border-color: #f1c40f !important;
            box-shadow: 0 0 0 0.25rem rgba(241, 196, 15, 0.25) !important;
        }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 800px;">
    
    <div class="mb-3">
        <a href="index.html" class="btn btn-outline-warning text-gold border-warning">
            <i class="fa-solid fa-house me-1"></i>回首頁
        </a>
    </div>

    <div class="card card-custom p-4 mb-5 shadow">
        <h3 class="fw-bold text-gold mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>撰寫留言</h3>
        
        <div id="alert-box"></div>

        <form id="msg-form">
            <div class="mb-3">
                <label for="input-name" class="form-label text-light">您的姓名 / 稱呼：</label>
                <input type="text" id="input-name" class="form-control bg-dark text-light border-secondary" placeholder="例如：五年三班 小明" maxlength="30" required>
            </div>
            
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="input-msg" class="form-label text-light mb-0">留言內容 (可按 Ctrl+Enter 快送)：</label>
                    <small class="text-muted" id="char-count">0 / 200 字</small>
                </div>
                <textarea id="input-msg" class="form-control bg-dark text-light border-secondary" rows="3" placeholder="請輸入想說的話..." maxlength="200" required></textarea>
            </div>

            <!-- 🔒 Google 身分驗證區域 -->
            <div class="p-3 mb-3 bg-dark rounded border border-secondary text-center">
                <div id="google-auth-container">
                    <p class="text-light small mb-2"><i class="fa-solid fa-shield-halved text-warning me-1"></i>發送留言前，請先點擊下方完成 Google 帳號身分驗證：</p>
                    <div class="d-flex justify-content-center">
                        <div id="g_id_onload"
                            data-client_id="929001008618-1d84tuch93dein6lte9pcu95p4gijibl.apps.googleusercontent.com"
                            data-callback="handleGoogleAuth"
                            data-auto_prompt="false">
                        </div>
                        <div class="g_id_signin"
                            data-type="standard"
                            data-size="large"
                            data-theme="outline"
                            data-text="sign_in_with"
                            data-shape="rectangular"
                            data-logo_alignment="left">
                        </div>
                    </div>
                </div>

                <div id="google-auth-success" class="d-none text-success fw-bold">
                    <i class="fa-solid fa-circle-check fs-5 me-1"></i> 已通過 Google 驗證 (<span id="verified-email-text" class="text-warning"></span>)
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="btn btn-warning fw-bold w-100" disabled>
                <i class="fa-solid fa-paper-plane me-1"></i>請先完成 Google 驗證
            </button>
        </form>
    </div>

    <hr class="border-secondary my-4">

    <div class="card card-custom p-4 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-gold mb-0"><i class="fa-solid fa-comments me-2"></i>留言列表</h3>
            <button onclick="loadMessages()" class="btn btn-sm btn-outline-light">
                <i class="fa-solid fa-rotate me-1"></i>重新整理
            </button>
        </div>
        
        <div id="message-list" class="mt-3">
            <p class="text-center text-muted py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>正在從 Google Sheet 載入留言...</p>
        </div>
    </div>

</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbykY_-YNNC4_AUl8L-04KZRhvtacNUK2nVpQUswcGs_Pqu0Dqs0WVvcvS1OuErnlw5P/exec";
    
    let isVerifiedByGoogle = false;
    let userGoogleEmail = ""; // 儲存解碼出的 Email

    // JWT Token 解碼函數
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return {};
        }
    }

    // Google 登入成功回調
    function handleGoogleAuth(response) {
        if (response.credential) {
            const userData = parseJwt(response.credential);
            userGoogleEmail = userData.email || "未知帳號";
            isVerifiedByGoogle = true;
            
            document.getElementById('google-auth-container').classList.add('d-none');
            document.getElementById('google-auth-success').classList.remove('d-none');
            document.getElementById('verified-email-text').textContent = userGoogleEmail;
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>發送留言';
            
            showAlert('Google 帳號驗證成功！', 'success');
        }
    }

    function formatTime(timeStr) {
        if (!timeStr) return "";
        let cleanStr = String(timeStr).replace(/\(.*\)/, '').trim();
        const d = new Date(cleanStr);
        if (isNaN(d.getTime())) return timeStr;
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        
        return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    function showAlert(msg, type = 'success') {
        const box = document.getElementById('alert-box');
        box.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show mb-3" role="alert">
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} me-2"></i>${msg}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    const msgInput = document.getElementById('input-msg');
    const charCount = document.getElementById('char-count');
    msgInput.addEventListener('input', () => {
        charCount.textContent = `${msgInput.value.length} / 200 字`;
    });

    msgInput.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('msg-form').requestSubmit();
        }
    });

    // 載入留言
    async function loadMessages() {
        const listDiv = document.getElementById('message-list');
        try {
            const res = await fetch(GAS_URL + "?t=" + new Date().getTime());
            const data = await res.json();
            
            if (data.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-muted py-3">目前還沒有任何留言，快來成為第一個留言的人吧！</p>';
                return;
            }

            listDiv.innerHTML = data.map(msg => `
                <div class="card msg-card p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong class="text-gold fs-5"><i class="fa-solid fa-user-circle me-1"></i>${escapeHtml(msg.name)}</strong>
                        <small class="text-time"><i class="fa-regular fa-clock me-1"></i>${escapeHtml(formatTime(msg.time))}</small>
                    </div>
                    <p class="mb-0 text-light fs-6 msg-content">${escapeHtml(msg.message)}</p>
                </div>
            `).join('');

        } catch (err) {
            listDiv.innerHTML = '<p class="text-center text-danger py-3"><i class="fa-solid fa-triangle-exclamation me-1"></i>讀取留言失敗，請確認網路連線。</p>';
        }
    }

    // 發送留言
    document.getElementById('msg-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!isVerifiedByGoogle) {
            showAlert('請先進行 Google 帳號驗證！', 'danger');
            return;
        }

        const submitBtn = document.getElementById('submit-btn');
        const name = document.getElementById('input-name').value;
        const message = document.getElementById('input-msg').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>發送中...';

        const formData = new URLSearchParams();
        formData.append('name', name);
        formData.append('message', message);
        formData.append('email', userGoogleEmail); // 悄悄將 Email 送出給 GAS

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            document.getElementById('msg-form').reset();
            charCount.textContent = '0 / 200 字';
            
            showAlert('留言成功發送！已更新至列表。', 'success');
            setTimeout(loadMessages, 1500);

        } catch (err) {
            showAlert('發送失敗，請稍後再試！', 'danger');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>發送留言';
        }
    });

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadMessages();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
