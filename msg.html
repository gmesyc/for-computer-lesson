<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google 搜尋驗證碼與規範網址 -->
    <meta name="google-site-verification" content="5t7AEdpChuhBJ5Md5lxJaiwJv_dLrNuTC2p88Nj6IPo" />
    <link rel="canonical" href="https://gmesyc.github.io/for-computer-lesson/msg.html" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訪客留言板 - 電腦課專用</title>
    
    <!-- Bootstrap 5 CSS & FontAwesome 圖示庫 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #2b2b2b; 
            color: #ffffff; 
            font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; 
        }
        .card-custom { 
            background-color: #3e3e3e; 
            border: 1px solid #555; 
            border-radius: 10px; 
        }
        .text-gold { 
            color: #f1c40f !important; 
        }
        /* ✨ 提高時間字體對比度與清晰度 */
        .text-time {
            color: #cbd5e1 !important;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .msg-card { 
            background-color: #1f1f1f; 
            border-left: 4px solid #f1c40f; 
            margin-bottom: 15px; 
        }
        /* ✨ 強制防爆框：無空格的長英文/符號自動斷行 */
        .msg-content {
            word-break: break-all;
            white-space: pre-line;
        }
        .form-control:focus {
            background-color: #212529 !important;
            color: #fff !important;
            border-color: #f1c40f !important;
            box-shadow: 0 0 0 0.25rem rgba(241, 196, 15, 0.25) !important;
        }
    </style>
</head>
<body>

<div class="container my-5" style="max-width: 800px;">
    
    <!-- 回首頁按鈕 -->
    <div class="mb-3">
        <a href="index.html" class="btn btn-outline-warning text-gold border-warning">
            <i class="fa-solid fa-house me-1"></i>回首頁
        </a>
    </div>

    <!-- 上半段：留言輸入表單 -->
    <div class="card card-custom p-4 mb-5 shadow">
        <h3 class="fw-bold text-gold mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>撰寫留言</h3>
        
        <!-- 提示訊息通知容器 -->
        <div id="alert-box"></div>

        <form id="msg-form">
            <!-- 🛡️ 蜜罐陷阱 (Honeypot) -->
            <div style="display: none !important;">
                <input type="text" id="hp-field" name="website_url_hp" tabindex="-1" autocomplete="off">
            </div>

            <div class="mb-3">
                <label for="input-name" class="form-label text-light">您的姓名 / 稱呼：</label>
                <input type="text" id="input-name" class="form-control bg-dark text-light border-secondary" placeholder="例如：五年三班 小明" maxlength="30" required>
            </div>
            
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="input-msg" class="form-label text-light mb-0">留言內容 (可按 Ctrl+Enter 快速送出)：</label>
                    <small class="text-muted" id="char-count">0 / 200 字</small>
                </div>
                <textarea id="input-msg" class="form-control bg-dark text-light border-secondary" rows="3" placeholder="請輸入想說的話..." maxlength="200" required></textarea>
            </div>
            
            <button type="submit" id="submit-btn" class="btn btn-warning fw-bold w-100">
                <i class="fa-solid fa-paper-plane me-1"></i>發送留言
            </button>
        </form>
    </div>

    <hr class="border-secondary my-4">

    <!-- 下半段：展示 Google Sheet 留言列表 -->
    <div class="card card-custom p-4 shadow">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-gold mb-0"><i class="fa-solid fa-comments me-2"></i>留言列表</h3>
            <button onclick="loadMessages()" class="btn btn-sm btn-outline-light">
                <i class="fa-solid fa-rotate me-1"></i>重新整理
            </button>
        </div>
        
        <!-- 留言動態載入區域 -->
        <div id="message-list" class="mt-3">
            <p class="text-center text-muted py-3"><i class="fa-solid fa-spinner fa-spin me-2"></i>正在從 Google Sheet 載入留言...</p>
        </div>
    </div>

</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbykY_-YNNC4_AUl8L-04KZRhvtacNUK2nVpQUswcGs_Pqu0Dqs0WVvcvS1OuErnlw5P/exec";

    // ✨ 強制清洗與格式化時間（相容 Wed Aug 05... 等長字串）
    function formatTime(timeStr) {
        if (!timeStr) return "";
        
        // 清理 Google Sheet 傳回的（台北標準時間）中文後綴
        let cleanStr = String(timeStr).replace(/\(.*\)/, '').trim();
        const d = new Date(cleanStr);
        
        if (isNaN(d.getTime())) return timeStr; // 解析失敗才輸出原字串
        
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        
        return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
    }

    // 提示條顯示函式
    function showAlert(msg, type = 'success') {
        const box = document.getElementById('alert-box');
        box.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show mb-3" role="alert">
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} me-2"></i>${msg}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    // 即時字數統計監聽
    const msgInput = document.getElementById('input-msg');
    const charCount = document.getElementById('char-count');
    msgInput.addEventListener('input', () => {
        charCount.textContent = `${msgInput.value.length} / 200 字`;
    });

    // ✨ 快捷鍵：在留言框按 Ctrl + Enter 直接觸發送出
    msgInput.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('msg-form').requestSubmit();
        }
    });

    // 1. 載入並顯示 Google Sheet 中的留言
    async function loadMessages() {
        const listDiv = document.getElementById('message-list');
        try {
            const res = await fetch(GAS_URL + "?t=" + new Date().getTime());
            const data = await res.json();
            
            if (data.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-muted py-3">目前還沒有任何留言，快來成為第一個留言的人吧！</p>';
                return;
            }

            listDiv.innerHTML = data.map(msg => `
                <div class="card msg-card p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong class="text-gold fs-5"><i class="fa-solid fa-user-circle me-1"></i>${escapeHtml(msg.name)}</strong>
                        <small class="text-time"><i class="fa-regular fa-clock me-1"></i>${escapeHtml(formatTime(msg.time))}</small>
                    </div>
                    <p class="mb-0 text-light fs-6 msg-content">${escapeHtml(msg.message)}</p>
                </div>
            `).join('');

        } catch (err) {
            listDiv.innerHTML = '<p class="text-center text-danger py-3"><i class="fa-solid fa-triangle-exclamation me-1"></i>讀取留言失敗，請確認網路連線。</p>';
        }
    }

    // 2. 發送留言到 Google Sheet
    document.getElementById('msg-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // 🛡️ 檢查蜜罐
        if (document.getElementById('hp-field').value !== "") {
            showAlert('留言成功發送！');
            document.getElementById('msg-form').reset();
            charCount.textContent = '0 / 200 字';
            return;
        }

        // 🛡️ 檢查 30 秒冷卻
        const lastPost = localStorage.getItem('last_post_time');
        const now = new Date().getTime();
        if (lastPost && (now - lastPost < 30000)) {
            const waitSec = Math.ceil((30000 - (now - lastPost)) / 1000);
            showAlert(`留言太頻繁囉！請等待 ${waitSec} 秒後再試。`, 'danger');
            return;
        }

        const submitBtn = document.getElementById('submit-btn');
        const name = document.getElementById('input-name').value;
        const message = document.getElementById('input-msg').value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>發送中...';

        const formData = new URLSearchParams();
        formData.append('name', name);
        formData.append('message', message);

        try {
            await fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });
            
            localStorage.setItem('last_post_time', new Date().getTime());

            // ✨ 發送成功：完全清空表單欄位（包含姓名與內容）並重置字數
            document.getElementById('msg-form').reset();
            charCount.textContent = '0 / 200 字';
            
            showAlert('留言成功發送！已更新至列表。', 'success');
            setTimeout(loadMessages, 1500);

        } catch (err) {
            showAlert('發送失敗，請稍後再試！', 'danger');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>發送留言';
        }
    });

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadMessages();
</script>

<!-- Bootstrap JS (支援 Alert 關閉功能) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
